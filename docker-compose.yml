services:
  postgres:
    image: postgres:16-alpine
    container_name: sonora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonora_user
      POSTGRES_PASSWORD: sonora_password
      POSTGRES_DB: sonora_dev
    ports:
      - "5432:5432"
    volumes:
      - sonora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonora_user -d sonora_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sonora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sonora_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sonora_postgres_data:
  sonora_redis_data:
